name: Dashboard quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/road-data/package-lock.json
      - run: npm --prefix packages/road-data ci
      - run: npm --prefix packages/road-data run build
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --webpack
  application-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: peruroad_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d peruroad_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: npm --prefix packages/road-data ci
      - run: npm --prefix packages/road-data run build
      - run: npm ci
      - run: node packages/road-data/scripts/prepare-test-database.ts
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/peruroad_test
          DATABASE_SSL_MODE: disable
      - run: node packages/road-data/scripts/import-pe22.ts
        env:
          DATABASE_URL: postgresql://peruroad_backend@localhost:5432/peruroad_test
          DATABASE_SSL_MODE: disable
      - run: npm run test:db
        env:
          DATABASE_URL: postgresql://peruroad_backend@localhost:5432/peruroad_test
          DATABASE_SSL_MODE: disable
